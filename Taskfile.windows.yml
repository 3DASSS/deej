version: "3"

# Windows build tasks. Included by the root Taskfile.yml, which passes BIN_DIR,
# LDFLAGS and VERSION_TAG. All tasks run from the repo root (dir: {{.ROOT_DIR}}).

tasks:
  syso:
    desc: Generate winres icon/manifest .syso files (idempotent)
    internal: true
    cmds:
      - go generate ./...
    status:
      - test -f pkg/deej/cmd/rsrc_windows_amd64.syso
      - test -f pkg/deej/cmd/rsrc_windows_arm64.syso

  frontend:
    internal: true
    dir: frontend
    cmds:
      - cmd: test -d node_modules || npm ci
      - npm run build

  build:
    desc: Build deej-release.exe (optimized, no console window)
    deps: [syso, frontend]
    cmds:
      - task: compile:release

  build:dev:
    desc: Build deej-dev.exe (debug symbols, console window)
    deps: [syso, frontend]
    cmds:
      - task: compile:dev

  build:all:
    desc: Build the release and development Windows binaries
    deps: [syso, frontend]
    cmds:
      - task: compile:release
      - task: compile:dev

  compile:release:
    internal: true
    cmds:
      - go build -tags production -o {{.BIN_DIR}}/deej-release.exe -ldflags "-H=windowsgui -s -w {{.LDFLAGS}} -X main.buildType=release" ./pkg/deej/cmd

  compile:dev:
    internal: true
    # Keep the standard library optimized: -N -l on all packages exceeds the
    # nosplit stack limit in syscall.Syscall15 on Windows arm64 with Go 1.26.
    cmds:
      - go build -o {{.BIN_DIR}}/deej-dev.exe -gcflags="github.com/nik9play/deej/...=-N -l" -ldflags "{{.LDFLAGS}} -X main.buildType=dev" ./pkg/deej/cmd

  build:dev:live:
    desc: Build deej-dev.exe without rebuilding the embedded frontend (for `wails3 dev`)
    # No `frontend` dep: in dev mode assets are served by Vite via
    # FRONTEND_DEVSERVER_URL, and the //go:embed only needs dist/.gitkeep to exist.
    deps: [syso]
    cmds:
      - go build -o {{.BIN_DIR}}/deej-dev.exe -gcflags="github.com/nik9play/deej/...=-N -l" -ldflags "{{.LDFLAGS}} -X main.buildType=dev" ./pkg/deej/cmd

  run:dev:
    desc: Run the already-built dev exe (inherits FRONTEND_DEVSERVER_URL under `wails3 dev`)
    cmds:
      - "{{.BIN_DIR}}/deej-dev.exe"

  package:
    desc: Build the release exe and the Inno Setup installer
    deps: [build]
    cmds:
      - ISCC /O{{.BIN_DIR}} "/DAppVersion={{.VERSION_TAG}}" /Qp scripts/windows/installer.iss

  package:universal:
    desc: Package prebuilt amd64 and arm64 binaries into one installer
    vars:
      AMD64_NAME: '{{default "deej-windows-amd64.exe" .AMD64_NAME}}'
      ARM64_NAME: '{{default "deej-windows-arm64.exe" .ARM64_NAME}}'
    preconditions:
      - sh: test -f {{.BIN_DIR}}/{{.AMD64_NAME}}
        msg: "Missing amd64 binary: {{.BIN_DIR}}/{{.AMD64_NAME}}"
      - sh: test -f {{.BIN_DIR}}/{{.ARM64_NAME}}
        msg: "Missing arm64 binary: {{.BIN_DIR}}/{{.ARM64_NAME}}"
    cmds:
      - ISCC /O{{.BIN_DIR}} "/DAppVersion={{.VERSION_TAG}}" /DAmd64Exe=../../{{.BIN_DIR}}/{{.AMD64_NAME}} /DArm64Exe=../../{{.BIN_DIR}}/{{.ARM64_NAME}} /Qp scripts/windows/installer.iss
