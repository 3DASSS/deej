# Настройка работы ползунков микшера
# Впишите 'master' для управления общей системной громкостью
# Впишите название процесса для управления его громкостью
# Впишите 'mic' для управления громкостью микрофона
# Впишите 'deej.unmapped' для управления громкостью всех каналов, кроме используемых в ползунках
# Только Windows - Впишите 'deej.current' для управления громкостью приложения, которое сейчас в фокусе
# Вы можете вписать полное имя аудиоустройства, чтобы управлять его громкостью
# На Linux устройства ввода получают суффикс ' (input)', например "HyperX Cloud (input)", так как вход и выход устройства могут иметь одинаковое имя
# Только Windows - Вы можете вписать 'system' для управления громкостью звуков Windows, таких как уведомления
# Вы можете вписать 'deej.obs:<имя источника>' для управления аудиоисточниками OBS (требуется obs.enabled: true)
# Вы можете вписать 'deej.discord:<имя>' для управления громкостью собеседника в голосовом канале, а также
# 'deej.discord.input' / 'deej.discord.output' для своих уровней внутри Discord (требуется discord.enabled: true)
slider_mapping:
  0: master
  1: deej.current
  2: mic
  3: discord.exe
  4: chrome.exe

# Если нужно несколько раскладок, замените slider_mapping выше на список профилей:
# у каждого своя раскладка и необязательное сочетание клавиш, которое переключает
# на него из любого приложения. Остальные настройки файла общие для всех профилей
# active_profile: default
# profiles:
#   - name: default
#     slider_mapping:
#       0: master
#       1: discord.exe
#   - name: gaming
#     hotkey: Ctrl+Alt+2
#     slider_mapping:
#       0: master
#       1: [game.exe, discord.exe]

# Инвертирование значений ползунков микшера. (1023 - 0, 0 - 1023)
invert_sliders: false

# Настройки COM-порта. Впишите в port значение auto для автоопределения порта по USB PID/VID.
com:
  port: auto
  baud_rate: 9600

  # Настройки VID и PID для автоматического поиска COM-порта.
  # Измените, если ваш микшер использует другой COM-чип.
  # vid: 0x1A86
  # pid: 0x7523

# Степень подавления шумов значений с микшера.
# Значения: low, default, high, none
# Используйте none, если подавление шумов происходит на стороне микшера.
noise_reduction: default

# Выбор языка. По умолчанию - auto, доступные варианты: ru, en, auto
language: auto

# Интеграция с OBS WebSocket (опционально)
# Управление аудиоисточниками OBS через 'deej.obs:<имя источника>' в slider_mapping
# Имена источников должны точно совпадать с именами в OBS (например, "Mic/Aux", "Звук рабочего стола")
obs:
  enabled: false
  host: localhost
  port: 4455
  password: ""
  # рекомендуется: положение физического ползунка совпадает с фейдером в OBS,
  # а на низкой громкости регулировка точнее; false ускоряет рост громкости
  volume_conversion: true

# Интеграция с Discord (опционально)
# Управление громкостью отдельных собеседников через 'deej.discord:<имя>' в slider_mapping,
# а также своими уровнями внутри Discord через 'deej.discord.input' / 'deej.discord.output'
# Discord разрешает это только для вашего собственного приложения, поэтому создайте его на
# https://discord.com/developers/applications, добавьте http://localhost в Redirect URI
# в разделе OAuth2 и укажите client id и секрет здесь. Затем привяжите аккаунт в окне
# настроек deej - Discord один раз попросит подтвердить доступ
discord:
  enabled: false
  client_id: ""
  client_secret: ""
  # рекомендуется для отдельных собеседников: положение физического ползунка
  # совпадает с регулятором Discord, а на низкой громкости регулировка точнее;
  # false ускоряет рост громкости. На цели input/output настройка не влияет
  volume_conversion: true
