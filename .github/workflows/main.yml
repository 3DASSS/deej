name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            go-flags: -tags=purego
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Purego loads these libraries at runtime; compilation needs no headers.
      - name: Install GTK runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4

      - name: Run tests
        run: go test ${{ matrix.go-flags }} ./...

  build-windows:
    name: Build (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deej (amd64)
        run: task windows:build:all

      - name: Rename binaries (amd64)
        run: |
          Rename-Item build/deej-release.exe deej-windows-amd64.exe
          Rename-Item build/deej-dev.exe deej-windows-amd64-dev.exe

      - name: Build deej (arm64)
        run: task windows:build:all
        env:
          GOARCH: arm64

      - name: Rename binaries (arm64)
        run: |
          Rename-Item build/deej-release.exe deej-windows-arm64.exe
          Rename-Item build/deej-dev.exe deej-windows-arm64-dev.exe

      # bundles both binaries into a single universal installer
      - name: Build installer
        run: task windows:package:universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deej-windows
          path: build/

  # The purego GUI backend lets one runner cross-compile both architectures.
  build-linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deej (amd64)
        run: task linux:build:all
        env:
          GOARCH: amd64

      - name: Rename binaries (amd64)
        run: |
          mv build/deej-release build/deej-linux-amd64
          mv build/deej-dev build/deej-linux-amd64-dev

      - name: Build deej (arm64)
        run: task linux:build:all
        env:
          GOARCH: arm64

      - name: Rename binaries (arm64)
        run: |
          mv build/deej-release build/deej-linux-arm64
          mv build/deej-dev build/deej-linux-arm64-dev

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deej-linux
          path: build/deej-linux-*

  # the headless build compiles Wails out (-tags headless), so it is cgo-free and
  # a single runner cross-compiles every arch without GTK/WebKit or Node
  build-linux-headless:
    name: Build (linux headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deej (headless, amd64 + arm64)
        run: |
          GOARCH=amd64 task linux:build:headless
          mv build/deej-headless build/deej-linux-amd64-headless
          GOARCH=arm64 task linux:build:headless
          mv build/deej-headless build/deej-linux-arm64-headless

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deej-linux-headless
          path: build/

  release:
    name: Create release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-linux-headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Architecture | Download |
            | --- | --- | --- |
            | Windows installer | amd64 + arm64 | [deej_setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej_setup.exe) |
            | Windows portable | amd64 | [deej-windows-amd64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej-windows-amd64.exe) |
            | Windows portable | arm64 | [deej-windows-arm64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej-windows-arm64.exe) |
            | Linux | amd64 | [deej-linux-amd64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej-linux-amd64) |
            | Linux | arm64 | [deej-linux-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej-linux-arm64) |
            | Linux (headless, no GUI) | amd64 | [deej-linux-amd64-headless](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej-linux-amd64-headless) |
            | Linux (headless, no GUI) | arm64 | [deej-linux-arm64-headless](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deej-linux-arm64-headless) |
          files: |
            artifacts/deej-windows-amd64.exe
            artifacts/deej-windows-arm64.exe
            artifacts/deej-linux-amd64
            artifacts/deej-linux-arm64
            artifacts/deej-linux-amd64-headless
            artifacts/deej-linux-arm64-headless
            artifacts/deej_setup.exe
