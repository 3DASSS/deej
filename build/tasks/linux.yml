version: "3"

# Linux build tasks. Included by the root Taskfile.yml, which passes BIN_DIR,
# LDFLAGS and VERSION_TAG. All tasks run from the repo root (dir: {{.ROOT_DIR}}).
#
# Two flavours of build exist:
#   build          - the full GUI app; uses Wails' experimental purego backend
#                    with CGO_ENABLED=0. Cross-compilable without a C compiler or
#                    GTK/WebKit headers; GTK/WebKit runtime libraries are needed
#                    on the target machine. EXTRA_TAGS=gtk3 selects legacy GTK3.
#   build:headless - a GUI-less daemon built with -tags headless. Compiles Wails
#                    out entirely, so it is pure Go (CGO_ENABLED=0) and
#                    cross-compilable to any GOOS/GOARCH. Controlled by config.yaml
#                    only (no tray, no settings window).

vars:
  GUI_TAGS: 'purego{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}}'

tasks:
  frontend:
    internal: true
    dir: frontend
    cmds:
      - cmd: test -d node_modules || npm ci
      - npm run build

  build:
    desc: Build the full GUI app (CGO-free, GTK4/WebKitGTK) -> deej-release
    deps: [frontend]
    cmds:
      - task: compile:release

  build:dev:
    desc: Build the full GUI app with debug symbols -> deej-dev
    deps: [frontend]
    cmds:
      - task: compile:dev

  build:all:
    desc: Build the release and development Linux GUI binaries
    deps: [frontend]
    cmds:
      - task: compile:release
      - task: compile:dev

  compile:release:
    internal: true
    env:
      GOOS: linux
      CGO_ENABLED: "0"
    cmds:
      - go build -tags "{{.GUI_TAGS}},production" -o {{.BIN_DIR}}/deej-release -ldflags "-s -w {{.LDFLAGS}} -X main.buildType=release" ./cmd/deej

  compile:dev:
    internal: true
    env:
      GOOS: linux
      CGO_ENABLED: "0"
    cmds:
      - go build -tags "{{.GUI_TAGS}}" -o {{.BIN_DIR}}/deej-dev -ldflags "{{.LDFLAGS}} -X main.buildType=dev" ./cmd/deej

  build:dev:live:
    desc: Build deej-dev without rebuilding the embedded frontend (for `wails3 dev`)
    # No `frontend` dep: in dev mode assets are served by Vite via
    # FRONTEND_DEVSERVER_URL, and the //go:embed only needs dist/.gitkeep to exist.
    env:
      GOOS: linux
      CGO_ENABLED: "0"
    cmds:
      - go build -tags "{{.GUI_TAGS}}" -o {{.BIN_DIR}}/deej-dev -ldflags "{{.LDFLAGS}} -X main.buildType=dev" ./cmd/deej

  run:dev:
    desc: Run the already-built dev binary (inherits FRONTEND_DEVSERVER_URL under `wails3 dev`)
    cmds:
      - "{{.BIN_DIR}}/deej-dev"

  build:headless:
    desc: Build a GUI-less, cgo-free daemon (cross-compilable) -> deej-headless
    env:
      GOOS: linux
      CGO_ENABLED: "0"
    cmds:
      - go build -tags headless -o {{.BIN_DIR}}/deej-headless -ldflags "-s -w {{.LDFLAGS}} -X main.buildType=release" ./cmd/deej
